[workspace]

resolver = "2"

members = [
    "./crates/qrlox-interpreter",
    "./crates/qrlox-syntax",
    "./crates/qrlox-macros", 
    "./crates/qrlox-cli",
]

default-members = [ "./crates/qrlox-cli" ]

[workspace.dependencies]
ariadne = "0.5.0"
chumsky = "0.9.3"
clap = { version = "4.5.23", features = [ "derive" ]}
logos = "0.15.0"
